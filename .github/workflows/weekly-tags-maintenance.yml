name: Weekly Tags Maintenance

on:
  schedule:
    # 北京时间每周一凌晨 4:00 执行 (UTC 时间每周日 20:00)
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-tags-maintenance-${{ github.ref }}
  cancel-in-progress: false

env:
  GUESSER_BRANCH: main
  GUESSER_UPSTREAM_REPOSITORY: kennylimz/anime-character-guessr
  PR_MESSAGE: CI：tags auto update

jobs:
  sync-guesser-fork:
    name: Sync Guesser Fork
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync Fork with Upstream via GitHub API
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          gh repo sync Cosmosuperbaka/anime-character-guessr --branch "$GUESSER_BRANCH"

  merge-user-feedback:
    name: Merge User Feedback Tags
    needs: sync-guesser-fork
    uses: ./.github/workflows/merge-user-tags.yml
    permissions:
      contents: write
    secrets: inherit

  update-extra-tags:
    name: Update Extra Tags
    needs: merge-user-feedback
    uses: ./.github/workflows/update-extra-tags.yml
    permissions:
      contents: write
    secrets: inherit

  # 标签此时已经同时推到 CCB-TagsCI 的 outputs/ 与 guesser fork 的
  # client/src/data/，直接通知 BakaGame 立刻重建本地 sqlite，
  # 不必干等它自己的「北京时间周一 05:00」定时任务。
  # 需要 CI_TOKEN 对 Cosmosuperbaka/BakaGame 有 repo 权限；派发失败会显红，
  # 但不影响已推送的标签——BakaGame 的定时任务仍会兜底重建。
  notify-bakagame:
    name: Trigger BakaGame Data Rebuild
    needs:
      - merge-user-feedback
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch bangumi-tags-updated
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          gh api --method POST repos/Cosmosuperbaka/BakaGame/dispatches \
            -f event_type=bangumi-tags-updated

  open-upstream-pr:
    name: Open Upstream Pull Request
    needs:
      - sync-guesser-fork
      - merge-user-feedback
      - update-extra-tags
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Open or update upstream pull request
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          pr_number="$(gh api "repos/$GUESSER_UPSTREAM_REPOSITORY/pulls?state=open&head=Cosmosuperbaka:$GUESSER_BRANCH&base=$GUESSER_BRANCH" --jq '.[0].number // ""')"
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --repo "$GUESSER_UPSTREAM_REPOSITORY" \
              --title "$PR_MESSAGE" \
              --body "$PR_MESSAGE"
            echo "Updated upstream PR #$pr_number."
            exit 0
          fi

          ahead_by="$(gh api "repos/$GUESSER_UPSTREAM_REPOSITORY/compare/$GUESSER_BRANCH...Cosmosuperbaka:$GUESSER_BRANCH" --jq '.ahead_by')"
          if [ "$ahead_by" = "0" ]; then
            echo "No Guesser Repository changes to open as an upstream PR."
            exit 0
          fi

          gh pr create \
            --repo "$GUESSER_UPSTREAM_REPOSITORY" \
            --head "Cosmosuperbaka:$GUESSER_BRANCH" \
            --base "$GUESSER_BRANCH" \
            --title "$PR_MESSAGE" \
            --body "$PR_MESSAGE"
