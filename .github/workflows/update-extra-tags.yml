name: Update Extra Tags

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CI_TOKEN:
        required: true

permissions:
  contents: write

env:
  GUESSER_BRANCH: main

jobs:
  update-tags:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout CCB-TagsCI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.CI_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        working-directory: ./character_tags_crawler
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run all extra tags crawlers
        env:
          PYTHONPATH: .
        run: |
          python extra_tags_crawler/run_all.py
      
      - name: Commit and push outputs to CCB-TagsCI
        run: |
          git config user.name "Cosmosuperbaka"
          git config user.email "Cosmosuperbaka@users.noreply.github.com"
          git add outputs/
          if ! git diff --staged --quiet; then
            git commit -m "CI：extra_tags auto update"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase FETCH_HEAD
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "No extra tag changes for CCB-TagsCI."
          fi

      - name: Checkout Guesser Repository
        uses: actions/checkout@v7
        with:
          repository: Cosmosuperbaka/anime-character-guessr
          ref: main
          token: ${{ secrets.CI_TOKEN }}
          path: anime-character-guessr

      - name: Copy outputs to Guesser Repository
        run: |
          # 创建目标文件夹以防不存在
          mkdir -p anime-character-guessr/client/public/data/extra_tags
          mkdir -p anime-character-guessr/client/public/assets/extra_tags
          
          # 同步 JSON 配置文件（同步覆盖并清理废弃项）
          rsync -av --delete outputs/extra_tags/ anime-character-guessr/client/public/data/extra_tags/
          
          # 同步静态图片资产（保持镜像一致，并自动删除主仓库中已被清理的废弃图片）
          rsync -av --delete outputs/assets/extra_tags/ anime-character-guessr/client/public/assets/extra_tags/

      - name: Commit and Push to Guesser Repository
        working-directory: ./anime-character-guessr
        run: |
          git config user.name "Cosmosuperbaka"
          git config user.email "Cosmosuperbaka@users.noreply.github.com"
          git add client/public/data/extra_tags/
          git add client/public/assets/extra_tags/
          if ! git diff --staged --quiet; then
            git commit -m "CI：extra_tags auto update"
            git fetch origin "$GUESSER_BRANCH"
            git rebase FETCH_HEAD
            git push origin "HEAD:$GUESSER_BRANCH"
          else
            echo "No extra tag changes for Guesser Repository."
          fi
